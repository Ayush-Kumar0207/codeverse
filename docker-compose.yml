services:
  redis:
    image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - codeverse_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: codeverse-server:local
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: development
      PORT: 5000
      CLIENT_URL: http://localhost:3000
      REDIS_URL: redis://redis:6379
      COLLABORATION_REQUIRE_REDIS: "true"
      COLLABORATION_REDIS_PREFIX: codeverse:collaboration
      EVIDENCE_REPLAY_ENGINE: process
      EVIDENCE_ANALYZER_ENGINE: process
      ARENA_EXECUTION_ENGINE: process
      UNDERSTANDING_EXECUTION_ENGINE: process
    ports:
      - "5000:5000"
      - "5001:5001"
    volumes:
      - codeverse_data:/workspace/server/.data
      - codeverse_deployments:/workspace/server/deployments
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:5000
    image: codeverse-client:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  codeverse_redis:
  codeverse_data:
  codeverse_deployments:
