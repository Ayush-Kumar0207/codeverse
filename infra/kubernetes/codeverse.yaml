apiVersion: v1
kind: Namespace
metadata:
  name: codeverse
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: codeverse-config
  namespace: codeverse
data:
  NODE_ENV: production
  PORT: "5000"
  CLIENT_URL: https://codeverse.example.com
  COLLABORATION_REQUIRE_REDIS: "true"
  COLLABORATION_REDIS_PREFIX: codeverse:collaboration
  COLLABORATION_RECOVERY_WINDOW_MS: "120000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeverse-server
  namespace: codeverse
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: codeverse-server
  template:
    metadata:
      labels:
        app: codeverse-server
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: server
          image: ghcr.io/ayush-kumar0207/codeverse-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: codeverse-config
            - secretRef:
                name: codeverse-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: codeverse-server
  namespace: codeverse
spec:
  selector:
    app: codeverse-server
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeverse-client
  namespace: codeverse
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: codeverse-client
  template:
    metadata:
      labels:
        app: codeverse-client
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: client
          image: ghcr.io/ayush-kumar0207/codeverse-client:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: codeverse-client
  namespace: codeverse
spec:
  selector:
    app: codeverse-client
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codeverse
  namespace: codeverse
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: codeverse.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: codeverse-client
                port:
                  number: 80
    - host: api.codeverse.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: codeverse-server
                port:
                  number: 5000
