name: Documentation improvement
description: Help make CodeVerse easier to understand, run, or contribute to.
title: "[Docs]: "
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: Thank you for making CodeVerse clearer. Please do not include credentials or private workspace content.
  - type: input
    id: location
    attributes:
      label: Page or section
      description: Link the page, heading, file, or workflow that needs work.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What was confusing or missing?
      description: Describe what you tried to understand and where you became blocked.
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Suggested improvement
      description: A proposed sentence, example, diagram, or structure is welcome but not required.
  - type: dropdown
    id: contribution
    attributes:
      label: Would you like to work on it?
      options:
        - Yes, with maintainer guidance
        - Yes, independently
        - Not right now
    validations:
      required: true
