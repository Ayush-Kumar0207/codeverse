name: Export raw demo recording

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/export-raw-demo.yml'
      - 'client/**'
      - 'server/**'
      - 'docs/demo/**'
      - 'scripts/**'
      - 'package*.json'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Install dependencies
        run: npm run install:all
      - name: Install Playwright Chromium
        run: npx --prefix client playwright install --with-deps chromium
      - name: Record clean demo
        run: npm run demo:record
      - name: Stage latest raw recording
        shell: bash
        run: |
          set -euo pipefail
          RAW="$(find docs/demo/raw -type f -name video.webm -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$RAW"
          cp "$RAW" codeverse-demo-raw.webm
      - name: Upload raw recording
        uses: actions/upload-artifact@v4
        with:
          name: codeverse-demo-raw
          path: codeverse-demo-raw.webm
          if-no-files-found: error
          retention-days: 1
