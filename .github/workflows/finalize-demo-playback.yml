name: Finalize demo playback fix

on:
  push:
    branches:
      - fix/demo-video-playback
    paths:
      - '.github/workflows/finalize-demo-playback.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/demo-video-playback
          fetch-depth: 0
      - name: Clean temporary extraction changes and fix README playback URL
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/export-demo-artifact.yml .tmp-demo/voice.part05
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          old = './docs/demo/codeverse-demo.mp4'
          new = 'https://codeverse-rho.vercel.app/media/codeverse-demo.mp4'
          if old not in s:
              raise SystemExit('expected demo link not found')
          s = s.replace(old, new)
          s = s.replace('Play the captioned product tour', 'Play the product tour')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/ci.yml .github/workflows/export-demo-artifact.yml .tmp-demo/voice.part05
          if ! git diff --cached --quiet; then
            git commit -m 'fix(demo): point README to browser-playable tour'
            git push origin HEAD:fix/demo-video-playback
          fi
