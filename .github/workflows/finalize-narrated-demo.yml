name: Finalize narrated demo

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-narrated-demo.yml'

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/narrated-demo-audio
          fetch-depth: 0

      - name: Download verified clean raw recording
        uses: actions/download-artifact@v4
        with:
          name: codeverse-demo-raw
          path: /tmp/codeverse-demo-raw
          repository: Ayush-Kumar0207/codeverse
          run-id: 32385705409
          github-token: ${{ github.token }}

      - name: Verify recovered sources and build browser video
        shell: bash
        run: |
          set -euo pipefail
          RAW=/tmp/codeverse-demo-raw/codeverse-demo-raw.webm
          test -f "$RAW"
          echo '047e805ab7d64ad4272f13cf09f42c73bc26bc32e46000c8325fb80521354afb  /tmp/codeverse-demo-raw/codeverse-demo-raw.webm' | sha256sum -c -

          cat .tmp-demo/final16.part*.b64 | tr -d '\n\r' | base64 -d > /tmp/codeverse-final-audio.m4a
          echo '7415e05c49e45eca4a1c47e7da218e859246be5227edf3a2fb0d0367620cc965  /tmp/codeverse-final-audio.m4a' | sha256sum -c -

          mkdir -p client/public/media
          ffmpeg -y \
            -i "$RAW" \
            -i /tmp/codeverse-final-audio.m4a \
            -filter:v 'tpad=stop_mode=clone:stop_duration=5,format=yuv420p' \
            -map 0:v:0 -map 1:a:0 \
            -t 76.444 \
            -c:v libx264 -preset medium -crf 21 -r 25 \
            -c:a copy \
            -movflags +faststart \
            client/public/media/codeverse-demo.mp4

          ffmpeg -y -i docs/demo/codeverse-demo.srt client/public/media/codeverse-demo.vtt
          cp docs/demo/codeverse-demo-poster.png client/public/media/codeverse-demo-poster.png

          python - <<'PY'
          import json, subprocess
          p = 'client/public/media/codeverse-demo.mp4'
          data = json.loads(subprocess.check_output([
              'ffprobe','-v','error','-show_streams','-show_format','-of','json',p
          ]))
          streams = data['streams']
          video = next(s for s in streams if s['codec_type'] == 'video')
          audio = next(s for s in streams if s['codec_type'] == 'audio')
          duration = float(data['format']['duration'])
          assert video['codec_name'] == 'h264', video
          assert video['pix_fmt'] == 'yuv420p', video
          assert int(video['width']) == 1440 and int(video['height']) == 900, video
          assert video['r_frame_rate'] == '25/1', video
          assert audio['codec_name'] == 'aac', audio
          assert int(audio['sample_rate']) == 48000, audio
          assert 76.3 <= duration <= 76.6, duration
          print(json.dumps({
              'duration': duration,
              'video': video['codec_name'],
              'pixel_format': video['pix_fmt'],
              'resolution': f"{video['width']}x{video['height']}",
              'fps': video['r_frame_rate'],
              'audio': audio['codec_name'],
              'sample_rate': audio['sample_rate'],
          }, indent=2))
          PY

      - name: Add browser player with optional captions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p client/app/demo-video
          cat > client/app/demo-video/page.tsx <<'EOF'
          import Link from "next/link";

          export default function DemoVideoPage() {
            return (
              <main className="min-h-screen bg-[#061012] text-slate-100">
                <div className="mx-auto flex min-h-screen w-full max-w-6xl flex-col justify-center px-4 py-8 sm:px-8">
                  <div className="mb-5 flex flex-wrap items-center justify-between gap-3">
                    <div>
                      <p className="text-xs font-semibold uppercase tracking-[0.22em] text-teal-300">CodeVerse product tour</p>
                      <h1 className="mt-2 text-3xl font-semibold tracking-tight text-white sm:text-4xl">Watch the narrated 76-second demo</h1>
                    </div>
                    <Link
                      href="/demo"
                      className="rounded-xl border border-teal-300/30 bg-teal-300/10 px-4 py-2 text-sm font-semibold text-teal-100 transition hover:bg-teal-300/15"
                    >
                      Try the interactive demo
                    </Link>
                  </div>

                  <video
                    className="w-full rounded-2xl border border-white/10 bg-black shadow-2xl shadow-black/40"
                    controls
                    playsInline
                    preload="metadata"
                    poster="/media/codeverse-demo-poster.png"
                    aria-label="CodeVerse narrated product tour"
                  >
                    <source src="/media/codeverse-demo.mp4" type="video/mp4" />
                    <track
                      kind="captions"
                      src="/media/codeverse-demo.vtt"
                      srcLang="en"
                      label="English"
                    />
                    Your browser does not support HTML5 video.
                  </video>

                  <p className="mt-4 text-sm leading-6 text-slate-400">
                    Narration and background music are included in the video. English captions are optional and remain off until you enable them from the player controls.
                  </p>
                </div>
              </main>
            );
          }
          EOF

      - name: Point README to browser-playable player
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          old = 'https://codeverse-rho.vercel.app/media/codeverse-demo.mp4'
          if old not in s:
              raise SystemExit('Expected production MP4 link not found in README')
          s = s.replace(old, 'https://codeverse-rho.vercel.app/demo-video')
          s = s.replace('Play the product tour', 'Play the narrated product tour')
          p.write_text(s)
          PY

      - name: Remove transfer and export staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-demo
          rm -f .github/workflows/export-raw-demo.yml
          test ! -e .tmp-demo
          test ! -e .github/workflows/export-raw-demo.yml

      - name: Commit permanent demo assets and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- README.md \
            client/app/demo-video/page.tsx \
            client/public/media/codeverse-demo.mp4 \
            client/public/media/codeverse-demo.vtt \
            client/public/media/codeverse-demo-poster.png
          git add -u -- .tmp-demo .github/workflows/export-raw-demo.yml

          git diff --cached --check
          git status --short
          git commit -m 'feat(demo): publish narrated tour with optional captions'
          git push origin HEAD:fix/narrated-demo-audio
