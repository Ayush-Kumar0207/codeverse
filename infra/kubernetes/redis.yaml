apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: codeverse-redis-data
  namespace: codeverse
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeverse-redis
  namespace: codeverse
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: codeverse-redis
  template:
    metadata:
      labels:
        app: codeverse-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
          command:
            - sh
            - -c
            - exec redis-server --appendonly yes --save 60 1 --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: codeverse-secrets
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: codeverse-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: codeverse-redis
  namespace: codeverse
spec:
  selector:
    app: codeverse-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: codeverse-server
  namespace: codeverse
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: codeverse-server
