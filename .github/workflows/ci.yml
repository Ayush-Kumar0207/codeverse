name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: node scripts/audit_repository.cjs

  server-tests:
    name: Server tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      REQUIRE_ALL_LANGUAGE_ADAPTERS: "true"
      TEST_REDIS_URL: redis://127.0.0.1:6379
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false
      - name: Verify native evidence toolchains
        run: python --version && java --version && gcc --version && g++ --version && go version && rustc --version
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm test

  production-evidence-sandbox:
    name: Production Evidence Docker sandbox
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      RUN_PRODUCTION_EVIDENCE_DOCKER_TESTS: "true"
      EVIDENCE_DOCKER_TEST_IMAGE: node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Pull digest-pinned evidence runner
        run: docker pull "$EVIDENCE_DOCKER_TEST_IMAGE"
      - name: Exercise production network, filesystem, identity, exit, and cleanup controls
        run: node --test tests/evidence.docker.test.js

  client-quality:
    name: Client lint, types, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  frontend-tests:
    name: Frontend unit and browser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - name: Install server dependencies for E2E
        run: npm ci
        working-directory: server
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  release-audits:
    name: Application and catalog audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install C++ compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - run: npm run release:audit --prefix client
